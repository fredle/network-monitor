[package]
name = "network-monitor"
version = "0.1.2"
edition = "2021"
description = "Wi-Fi and ping monitor for the Windows system tray"
publish = false

[[bin]]
name = "network-monitor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "0.26"
velopack = "1.2.161"
interprocess = "2.4"
windows-registry = "0.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "ApplicationModel",
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
